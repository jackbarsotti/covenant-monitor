  expected:
    # total_debt / ebitda against the 4.50 step-up level in effect at 2025-12-31.
    - covenant: max_leverage
      ratio: 2.3
      threshold: 4.5
      headroom: 2.2

questions:
  - question: What is the maximum leverage ratio after a Qualified Acquisition, and how does it step back down?
    trap: false
    answer: >-
      4.75 to 1.00 for the four fiscal quarters ending after the acquisition (including the
      quarter in which it closes), then 4.50, 4.25 and 4.00 to 1.00 for the next three
      quarters, after which it returns to 3.75 to 1.00. The agreement deems these step-ups in
      effect for the Qualified Acquisition consummated on November 15, 2024.
    section: Section 1.1 (Maximum Leverage Ratio)
  - question: How much in cash litigation payments can be added back to Consolidated EBITDA?
    trap: false
    answer: >-
      Cash Litigation Payments (net of cash litigation receipts) can be added back up to
      $1,160,000,000 in aggregate since December 31, 2025.
    section: Section 1.1 (Consolidated EBITDA, clause (g))
  - question: Does debt raised to prefund an acquisition count in Consolidated Total Debt before the deal closes?
    trap: false
    answer: >-
      No. Indebtedness incurred to prefund a Qualified Acquisition is excluded from
      Consolidated Total Debt for Section 9.1 until the acquisition closes or is abandoned,
      terminated or expires.
    section: Section 1.1 (Consolidated Total Debt)
  - question: What was Boston Scientific's Consolidated Leverage Ratio as of December 31, 2025?
    trap: true
    answer: null
    section: null
  - question: What maximum leverage ratio applies under the $6.0 billion Term Loan Credit Agreement Boston Scientific signed the same day?
    trap: true
    answer: null
    section: null
