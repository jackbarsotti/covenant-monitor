    cap: null
  - name: Consolidated Interest Expense, amortization or writeoff of debt discount and debt issuance costs, and other fees and charges associated with Indebtedness
    section: Section 1.1 (Consolidated EBITDA, clause (b))
    cap: null
  - name: Depreciation expense
    section: Section 1.1 (Consolidated EBITDA, clause (c))
    cap: null
  - name: Amortization or write-down of intangibles (including goodwill) and organization costs
    section: Section 1.1 (Consolidated EBITDA, clause (d))
    cap: null
  - name: Extraordinary, unusual or nonrecurring expenses or losses, to the extent non-cash (including acquisition-related special charges, purchased R&D, inventory step-up, fair value adjustments and unrealized investment impairments)
    section: Section 1.1 (Consolidated EBITDA, clause (e))
    cap: null
  - name: Non-cash stock compensation expense
    section: Section 1.1 (Consolidated EBITDA, clause (f))
    cap: null
  - name: Cash litigation costs, net of cash litigation receipts (Cash Litigation Payments)
    section: Section 1.1 (Consolidated EBITDA, clause (g))
