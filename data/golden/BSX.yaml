# Boston Scientific: $3.0B five-year revolving credit agreement (2026 Revolving Credit
# Agreement), EX-10.1 to the 8-K filed 2026-02-26. Chosen over EX-10.2, the $2.0B 364-day
# revolver tied to a pending acquisition, which has the same covenant but a short life.
# No amendment found in BSX filings through 2026-10-07.
#
# The Maximum Leverage Ratio is 3.75 with step-ups after a Qualified Acquisition (4.75 for the
# four fiscal quarters including the closing quarter, then 4.50, 4.25, 4.00). The definition
# deems the step-ups for the November 15, 2024 acquisition to be in effect, so they are fixed
# to dates: 4.75 through the quarter ended 2025-09-30, 4.50 at 2025-12-31, 4.25 at
# 2026-03-31, 4.00 at 2026-06-30, and 3.75 from the quarter ending 2026-09-30. BSX's FY2025
# 10-K states: "As of December 31, 2025, the maximum permitted leverage ratio is 4.50 times."
# A later Qualified Acquisition would start a new step-up cycle; none is reflected here.
#
# Ratios are plain numbers: 3.5 means 3.50 to 1.00. Money is in USD, no commas.

provenance: ai_drafted_ai_verified

company:
  ticker: BSX
  cik: 885725
  name: BOSTON SCIENTIFIC CORP

agreement:
  accession: 0000885725-26-000017
  exhibit: EX-10.1
  url: https://www.sec.gov/Archives/edgar/data/885725/000088572526000017/exhibit101-creditagreement.htm
  agreement_date: 2026-02-26
  amendments: []

covenants:
  - type: max_leverage
    description: Consolidated Leverage Ratio
    thresholds:
      - ratio: 4.75
        effective_from: null
      - ratio: 4.5
        effective_from: 2025-12-31
      - ratio: 4.25
        effective_from: 2026-03-31
      - ratio: 4.0
        effective_from: 2026-06-30
      - ratio: 3.75
        effective_from: 2026-09-30
    test_frequency: quarterly
    section: Section 9.1
    # Quote is from the Section 1.1 definition of "Maximum Leverage Ratio" (the level Section 9.1
    # incorporates), clause (b): the 4.50 level in effect at 2025-12-31.
    quote: >-
      (b) for the fiscal quarter ended immediately after such four fiscal quarters referred to in clause (a), the Maximum Leverage Ratio shall be 4.50 to 1.00

