  - name: Income or expense from business combinations under FASB Statement No. 141(R) that would have been a cost of the acquisition under FASB Statement No. 141, including contingent consideration
    section: Section 1.1 (Consolidated EBITDA, clause (i))
    cap: null
  - name: Non-Cash Charges, including those attributable to litigation, intangible asset impairment and intellectual property research and development charges
    section: Section 1.1 (Consolidated EBITDA, clause (j))
    cap: null
  - name: Cash receipts received in connection with litigation related Non-Cash Charges (added to Consolidated Net Income)
    section: Section 1.1 (Consolidated Net Income)
    cap: null

latest_fiscal_year:
  period_end: 2025-12-31
  inputs:
    operating_income:
      value: 3613000000
      source: OperatingIncomeLoss
      accession: 0000885725-26-000010
    depreciation_amortization:
      value: 1368000000
      source: DepreciationDepletionAndAmortization
      accession: 0000885725-26-000010
    ebitda:
      value: 4981000000
      source: sum of OperatingIncomeLoss + DepreciationDepletionAndAmortization
      accession: 0000885725-26-000010
    current_debt:
      value: 299000000
      source: DebtCurrent
      accession: 0000885725-26-000010
    long_term_debt:
      value: 11137000000
      source: LongTermDebtAndCapitalLeaseObligations
      accession: 0000885725-26-000010
    total_debt:
      value: 11436000000
      source: sum of LongTermDebtAndCapitalLeaseObligations + DebtCurrent
