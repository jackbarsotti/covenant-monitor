# CACI: Second Amended and Restated Credit Agreement dated November 25, 2025 ($2.0B revolver
# and $1.25B term loan, both maturing November 25, 2030), EX-10.1 to the 8-K filed 2025-12-01.
# No amendment found through the fiscal 2026 10-K (filed 2026-08-06). The March 9, 2026
# Amendment No. 1 amends CACI's separate JPM Term Loan B Credit Agreement, not this one.
#
# The leverage maximum can rise to 5.00 for a Leverage Increase Period after a Permitted
# Acquisition over $200,000,000, at CACI's election. That is conditional, not a calendar step,
# so only the 4.50 base level is listed.
#
# Ratios are plain numbers: 3.5 means 3.50 to 1.00. Money is in USD, no commas.

provenance: ai_drafted_ai_verified

company:
  ticker: CACI
  cik: 16058
  name: CACI INTERNATIONAL INC /DE/

agreement:
  accession: 0001628280-25-054481
  exhibit: EX-10.1
  url: https://www.sec.gov/Archives/edgar/data/16058/000162828025054481/secondar1.htm
  agreement_date: 2025-11-25
  amendments: []

covenants:
  - type: max_leverage
    description: Consolidated Total Net Leverage Ratio
    thresholds:
      - ratio: 4.5
        effective_from: null
    test_frequency: quarterly
    section: Section 8.11(a)
    quote: >-
      (a)Consolidated Total Net Leverage Ratio. Permit the Consolidated Total Net Leverage Ratio as of the end of any fiscal quarter of the Borrower, commencing with the fiscal quarter ending December 31, 2025, to be greater than 4.50:1.00
  - type: min_interest_coverage
    description: Consolidated Interest Coverage Ratio
    thresholds:
      - ratio: 3.0
        effective_from: null
    test_frequency: quarterly
    section: Section 8.11(b)
    quote: >-
      (b)Consolidated Interest Coverage Ratio. Permit the Consolidated Interest Coverage Ratio as of the end of any fiscal quarter of the Borrower, commencing with the fiscal quarter ending December 31, 2025, to be less than 3.00:1.0.

