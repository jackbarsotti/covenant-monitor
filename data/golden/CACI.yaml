questions:
  - question: How high can the leverage maximum go after a large acquisition, and how often can CACI use that relief?
    trap: false
    answer: >-
      If a Permitted Acquisition's consideration exceeds $200,000,000 and CACI gives notice
      before the end of that fiscal quarter, the maximum rises to 5.00 to 1.0 for that quarter
      and the following three (a Leverage Increase Period). CACI may elect no more than two
      Leverage Increase Periods during the term.
    section: Section 8.11(a)
  - question: How much cash can CACI net against debt in the Consolidated Total Net Leverage Ratio?
    trap: false
    answer: Up to $500 million of Unrestricted Cash.
    section: Section 1.01 (Consolidated Total Net Leverage Ratio)
  - question: Is there a limit on pro forma cost savings and synergies added to Consolidated EBITDA?
    trap: false
    answer: >-
      Yes. They must be expected within 24 months of the Investment or asset disposition, and
      the add-back may not exceed 25% of Consolidated EBITDA for the period, calculated after
      giving effect to the add-back.
    section: Section 1.01 (Consolidated EBITDA, clause (c))
  - question: What was CACI's Consolidated Total Net Leverage Ratio as of June 30, 2026?
    trap: true
    answer: null
    section: null
  - question: What interest rate do CACI's senior unsecured notes due 2033 bear?
    trap: true
    answer: null
    section: null
