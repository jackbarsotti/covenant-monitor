questions:
  - question: What is the maximum Consolidated Total Net Leverage Ratio for Test Periods ending on or after September 30, 2027?
    trap: false
    answer: 4.25 to 1.00.
    section: Section 7.08
  - question: Was the Financial Covenant tested in quarters when the revolver was undrawn?
    trap: false
    answer: >-
      Not at first. For Test Periods ending on or before the fiscal quarter ending on or about
      December 31, 2025, the covenant did not apply if outstanding Revolving Credit Loans
      (including Swingline Loans) and Letters of Credit, excluding cash-collateralized and
      undrawn Letters of Credit, were 0.0% of the Revolving Credit Commitments (the Testing
      Condition). Later Test Periods are tested regardless of usage.
    section: Section 7.08
  - question: What limits the Pro Forma Cost Savings add-back to Consolidated EBITDA?
    trap: false
    answer: >-
      The Shared EBITDA Cap: together with certain restructuring-type exclusions and run-rate
      synergies, it may not exceed the greater of $300,000,000 and 20.0% of Consolidated
      EBITDA for the Test Period.
    section: Section 1.01 (Consolidated EBITDA)
  - question: What was Seagate's Consolidated Total Net Leverage Ratio for the Test Period ended July 3, 2026?
    trap: true
    answer: null
    section: null
  - question: What maximum leverage ratio did Seagate's prior credit agreement dated February 20, 2019 require?
    trap: true
    answer: null
    section: null
