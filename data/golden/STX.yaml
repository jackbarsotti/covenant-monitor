# Seagate: Credit Agreement dated January 30, 2025 ($1.3B senior unsecured revolver maturing
# January 30, 2030), EX-10.1 to the 8-K filed 2025-02-03. Borrower is Seagate HDD Cayman;
# Holdings is Seagate Technology Holdings plc. No amendment found in Seagate filings through
# 2026-09-09 (10-K for fiscal 2026 lists only the original agreement).
#
# The single Financial Covenant (Section 7.08) is a net leverage maximum that steps down on
# a dated schedule. For Test Periods ending on or before the fiscal quarter ending on or about
# December 31, 2025 it applied only if the revolver was drawn (the "Testing Condition");
# after that it is tested every quarter.
#
# Ratios are plain numbers: 3.5 means 3.50 to 1.00. Money is in USD, no commas.

provenance: ai_drafted_ai_verified

company:
  ticker: STX
  cik: 1137789
  name: Seagate Technology Holdings plc

agreement:
  accession: 0001137789-25-000023
  exhibit: EX-10.1
  url: https://www.sec.gov/Archives/edgar/data/1137789/000113778925000023/seagate-creditagreementedg.htm
  agreement_date: 2025-01-30
  amendments: []

covenants:
  - type: max_leverage
    description: Maximum Consolidated Total Net Leverage Ratio (the Financial Covenant)
    thresholds:
      - ratio: 6.75
        effective_from: null
      - ratio: 5.5
        effective_from: 2025-09-30
      - ratio: 4.75
        effective_from: 2026-09-30
      - ratio: 4.25
        effective_from: 2027-09-30
    test_frequency: quarterly
    section: Section 7.08
    # Row of the Section 7.08 table in effect for the Test Period ending 2026-07-03.
    quote: >-
      Each Test Period ending on or after September 30, 2025, and on or prior to September 30, 2026 5.50 to 1.00

